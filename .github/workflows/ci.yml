name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate bundled dataset (determinism check)
        run: |
          python scripts/generate_dataset.py
          git diff --exit-code -- data/labeled_auth_events.csv

      - name: Run unit tests (offline; no Docker/network required)
        run: python -m pytest -v --cov=sentinel_triage --cov-report=term-missing

      - name: Run eval harness
        run: python scripts/run_eval.py --out eval_report.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sentinel-triage:ci .
